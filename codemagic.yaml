workflows:
  ios-unsigned:
    name: SteadyFisheye unsigned iOS build
    max_build_duration: 40
    instance_type: mac_mini_m2

    environment:
      xcode: 16.4

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show build environment
        script: |
          set -e
          xcodebuild -version
          xcodebuild -project SteadyFisheye.xcodeproj -list
      - name: Build the CoreML detector (optional)
        script: |
          # Deliberately allowed to fail. The app ships either way, falling back
          # to the classical circle detector when the bundle has no model, so a
          # broken export must never take the whole build down with it.
          if [ ! -f models/screen.pt ]; then
            echo "no models/screen.pt — building without the detector"
            exit 0
          fi
          python3 -m venv "$HOME/mlvenv" || exit 0
          "$HOME/mlvenv/bin/pip" install -q --upgrade pip || exit 0
          # numpy is pinned: coremltools 9's export breaks on numpy 2.4.
          "$HOME/mlvenv/bin/pip" install -q coremltools "numpy<=2.3.5" torch ultralytics pillow || exit 0
          "$HOME/mlvenv/bin/python" tools/make_coreml.py || exit 0
          du -sh SteadyFisheye/ScreenDetector.mlmodelc
      - name: Build without signing
        script: |
          set -e
          STAMP=$(date +%m%d%H%M)
          echo "build stamp = $STAMP"
          xcodebuild \
            -project SteadyFisheye.xcodeproj \
            -scheme SteadyFisheye \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            MARKETING_VERSION=1.1 \
            CURRENT_PROJECT_VERSION="$STAMP" \
            clean build
      - name: Inject the detector into the app
        script: |
          set -e
          # Copied in after the build rather than referenced from the Xcode
          # project: a resource the project points at but the build cannot
          # produce is a hard build failure, and the model is meant to be
          # optional. The IPA is unsigned at this point, so adding a file here
          # needs no re-signing.
          APP=$(find build/Build/Products -maxdepth 3 -name 'SteadyFisheye.app' -type d | head -1)
          test -n "$APP"
          if [ -d SteadyFisheye/ScreenDetector.mlmodelc ]; then
            cp -R SteadyFisheye/ScreenDetector.mlmodelc "$APP/"
            echo "detector in the bundle: $(du -sh "$APP/ScreenDetector.mlmodelc")"
          else
            echo "no detector model — the app falls back to the classical circle detector"
          fi
      - name: Package unsigned IPA
        script: |
          set -e
          app_path=$(find build/Build/Products -maxdepth 3 -name 'SteadyFisheye.app' -type d | head -1)
          test -n "$app_path"
          mkdir -p out/Payload
          cp -R "$app_path" out/Payload/
          (cd out && zip -qr SteadyFisheye-unsigned.ipa Payload)
          shasum -a 256 out/SteadyFisheye-unsigned.ipa

    artifacts:
      - out/SteadyFisheye-unsigned.ipa
      - build/Build/Products/**/*.app
